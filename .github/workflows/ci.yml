name: Mechanics RPG CI

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanics-rpg-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require source baseline
        run: test -f source/world/behavior_packs/Mechanics_RPG/manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: python tools/validate.py
      - name: Build packages
        run: python tools/package.py
      - name: Verify packages
        run: python tools/verify_package.py
      - name: Checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mechanics-rpg-package
          path: |
            dist/*.mcworld
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
