name: Mechanics RPG v1.4.48 One-shot Release

on:
  push:
    branches: [main]
    paths:
      - 'source/world/behavior_packs/Mechanics_RPG/manifest.json'
      - 'docs/V1.4.48-RELEASE-NOTES.md'
      - '.github/workflows/release-v1.4.48-once.yml'

permissions:
  contents: write

jobs:
  release-v1-4-48:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('source/world/behavior_packs/Mechanics_RPG/manifest.json').read_text(encoding='utf-8'))['header']['version']
          assert v == [1,4,48], v
          PY
      - name: Validate
        run: python tools/validate.py
      - name: Package
        run: python tools/package.py
      - name: Verify
        run: python tools/verify_package.py
      - name: Checksums
        run: sha256sum dist/*.mcworld dist/*.zip | tee dist/SHA256SUMS.txt
      - name: Publish v1.4.48 if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.48 >/dev/null 2>&1; then
            echo 'v1.4.48 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.4.48 dist/*.mcworld dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Mechanics RPG v1.4.48' \
            --notes-file docs/V1.4.48-RELEASE-NOTES.md
