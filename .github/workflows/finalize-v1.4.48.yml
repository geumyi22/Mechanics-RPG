name: Finalize Mechanics RPG v1.4.48

on:
  push:
    branches: [fix/v1.4.48-release]
    paths:
      - '.release-staging/READY'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'release: trigger v1.4.48 finalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild exact stable subspace.js
        shell: bash
        run: |
          cat             .release-staging/subspace.part01.txt             .release-staging/subspace.part02.txt             .release-staging/subspace.part03.txt             .release-staging/subspace.part04.txt             .release-staging/subspace.part05.txt             > source/world/behavior_packs/Mechanics_RPG/scripts/subspace.js

          echo "770313a7a2381bf1156291354dd02500dc0717506cc5916e5d7535f484b143a4  source/world/behavior_packs/Mechanics_RPG/scripts/subspace.js" | sha256sum -c -
          echo "446dc4f5a403d6323bdba8d304be0e6add5e8a1d6316f2411f1f2a94a4000e8a  source/world/resource_packs/Mechanics_RPG_Resources/textures/item_texture.json" | sha256sum -c -

      - name: Remove staging payload
        run: rm -rf .release-staging

      - name: Rebuild SOURCE-MANIFEST
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          root = Path("source/world")
          rows = []
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              b = p.read_bytes()
              rows.append({
                  "path": p.relative_to(root).as_posix(),
                  "size": len(b),
                  "sha256": hashlib.sha256(b).hexdigest(),
              })

          assert len(rows) == 294, f"expected 294 source files, got {len(rows)}"
          out = {
              "project": "Mechanics RPG",
              "baseline_version": "1.4.48",
              "baseline_artifact": "Mechanics_RPG_v1.4.48_SUBSPACE_SAFE_GUARD",
              "source_root": "source/world",
              "file_count": len(rows),
              "files": rows,
          }
          Path("SOURCE-MANIFEST.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Static validation
        run: python tools/validate.py
      - name: Deterministic package
        run: python tools/package.py
      - name: Verify package
        run: python tools/verify_package.py
      - name: Package checksums
        run: sha256sum dist/*

      - name: Commit finalized stable source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v1.4.48.yml
          git add -A
          git commit -m "release: finalize v1.4.48 stable source"
          git push origin HEAD:fix/v1.4.48-release
